[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opcua-cli-client"
version = "0.1.0"
description = "OPC UA Client Azubi Projekt"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "asyncua>=1.1.5"
]

[project.scripts]
opcua-client = "opcua_client.main:main"

[tool.setuptools.packages.find]
where = ["src"]
